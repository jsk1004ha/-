<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>용병 길드 키우기 (V1.0)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Black+Han+Sans&display=swap');
        :root {
            --font-title: 'Black Han Sans', sans-serif; --font-body: 'Do Hyeon', sans-serif;
            --color-bg: #1a1d24; --color-bg-panel: #242830; --color-bg-element: #313642; --color-border: #4a4f58;
            --color-text: #e8e8e8; --color-text-dim: #a0a8b0; --color-primary: #ffc107; --color-accent: #f44336;
            --color-green: #4caf50; --color-blue: #2196F3; --color-purple: #9C27B0;
            --grade-common: #bdc3c7; --grade-uncommon: #2ecc71; --grade-rare: #3498db; --grade-heroic: #9b59b6;
            --grade-legendary: #f39c12; --grade-mythic: #1abc9c; --grade-primal: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            --grade-c: #a98e78; --grade-b: #78909c; --grade-a: #5c6bc0; --grade-s: #d4af37; --grade-l: #e74c3c;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font-body); background-color: var(--color-bg); color: var(--color-text); margin: 0; display: flex; justify-content: center; align-items: flex-start; user-select: none; }
        .game-container { width: 100%; max-width: 500px; min-height: 100vh; background-color: var(--color-bg-panel); box-shadow: 0 0 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .header { padding: 15px; text-align: center; border-bottom: 1px solid var(--color-border); background: linear-gradient(145deg, var(--color-bg-element), var(--color-bg-panel)); position: relative; }
        .header h1 { margin: 0; font-family: var(--font-title); font-size: 2em; color: var(--color-primary); text-shadow: 0 0 8px rgba(255, 193, 7, 0.6); }
        #event-banner { position: absolute; top: 0; right: 0; background-color: var(--color-accent); color: white; padding: 4px 10px; font-size: 0.8em; font-weight: bold; border-bottom-left-radius: 8px; }
        .stats-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 15px; border-bottom: 1px solid var(--color-border); }
        .stat-item { background-color: var(--color-bg-element); padding: 8px 12px; border-radius: 8px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .stat-item .label { font-size: 1.1em; color: var(--color-text-dim); display: flex; align-items: center; gap: 6px; }
        .stat-item .label::before { font-family: 'Arial'; font-weight: bold; }
        #combat-power-stat .label::before { content: '⚔️'; } #tp-stat .label::before { content: '🧠'; } #gold-stat .label::before { content: '💰'; } #gem-stat .label::before { content: '💎'; }
        .stat-item .value { font-size: 1.2em; font-weight: bold; color: var(--color-primary); }
        #combat-power-display { color: var(--color-accent); } #training-points-display { color: #87CEFA; } #gem-display { color: var(--color-blue); }
        .main-content { flex-grow: 1; padding: 15px; display: flex; flex-direction: column; }
        .battlefield-section { height: 220px; background: linear-gradient(to bottom, #3a3a4a, #2a2a33); border-radius: 12px; border: 1px solid var(--color-border); display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer; overflow: hidden; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        #target-dummy-container { height: 80%; transition: transform 0.1s ease-out; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.4)); }
        #target-dummy-container.shake { animation: shake 0.2s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-2deg); } 75% { transform: translateX(5px) rotate(2deg); } }
        .damage-text-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .damage-text { position: absolute; font-size: 1.4em; font-weight: bold; text-shadow: 1px 1px 3px black; animation: floatUp 1s ease-out forwards; white-space: pre; text-align: center; }
        .damage-text.cp { color: var(--color-accent); } .damage-text.tp { color: #87CEFA; } .damage-text.gold { color: var(--color-primary); }
        @keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-80px); opacity: 0; } }
        .tabs { display: flex; background-color: var(--color-bg-element); flex-wrap: wrap; }
        .tab-button { flex-grow: 1; padding: 12px 5px; background-color: transparent; border: none; color: var(--color-text-dim); cursor: pointer; font-size: 1em; font-weight: bold; border-bottom: 4px solid transparent; transition: all 0.2s ease; position: relative; }
        .tab-button:hover { background-color: var(--color-border); } .tab-button.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
        .notification-dot { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; background-color: var(--color-accent); border-radius: 50%; border: 1px solid white; display: none; }
        .tab-content { display: none; flex-direction: column; gap: 10px; padding: 15px; animation: fadeIn 0.5s; }
        .tab-content.active { display: flex; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .section-title { font-family: var(--font-title); font-size: 1.5em; color: var(--color-primary); margin: 15px 0 10px 0; border-left: 4px solid var(--color-primary); padding-left: 10px; }
        .upgrade-list, .item-list, .dungeon-list, .mission-list { display: flex; flex-direction: column; gap: 10px; }
        .upgrade-item, .item-card, .dungeon-item, .mission-item { display: flex; align-items: center; background-color: var(--color-bg-element); padding: 12px; border-radius: 8px; border: 1px solid var(--color-border); transition: background-color 0.2s; }
        .item-card, .mission-item { border-left-width: 5px; }
        .item-card.item-grade-C, .item-card.item-grade-일반 { border-left-color: var(--grade-common); } .item-card.item-grade-B, .item-card.item-grade-고급 { border-left-color: var(--grade-uncommon); } .item-card.item-grade-A, .item-card.item-grade-희귀 { border-left-color: var(--grade-rare); } .item-card.item-grade-S, .item-card.item-grade-영웅 { border-left-color: var(--grade-heroic); } .item-card.item-grade-L, .item-card.item-grade-전설 { border-left-color: var(--grade-legendary); }
        .item-card.item-grade-신화 { border-left-color: var(--grade-mythic); } .item-card.item-grade-태초 { border-image: var(--grade-primal) 1; }
        .upgrade-info, .item-info, .dungeon-info, .mission-info { flex-grow: 1; }
        .item-name, .upgrade-name, .mission-desc { font-weight: bold; font-size: 1.1em; }
        .item-level, .item-effect, .upgrade-effect, .dungeon-req, .mission-reward { font-size: 0.9em; color: var(--color-text-dim); margin-top: 4px; }
        .mission-progress-bar { width: 100%; background-color: var(--color-bg); border-radius: 4px; overflow: hidden; margin-top: 5px; height: 10px; }
        .mission-progress-fill { height: 100%; background-color: var(--color-primary); width: 0%; transition: width 0.3s; }
        .buy-button, .gacha-button, .challenge-button { padding: 10px 18px; border: none; background-color: var(--color-primary); color: var(--color-bg); font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .buy-button:hover, .gacha-button:hover, .challenge-button:hover { filter: brightness(1.1); } .buy-button:active, .gacha-button:active, .challenge-button:active { transform: scale(0.98); filter: brightness(0.9); } .buy-button:disabled, .gacha-button:disabled, .challenge-button:disabled { background-color: var(--color-border); color: var(--color-text-dim); cursor: not-allowed; box-shadow: none; filter: none; }
        .gacha-section { display: flex; flex-direction: column; gap: 10px; padding: 15px; border: 1px solid var(--color-border); border-radius: 8px; align-items: center; background-color: var(--color-bg); }
        .gacha-buttons-container { display: flex; gap: 10px; margin-top: 10px;}
        .prestige-section { padding: 15px; background-color: var(--color-bg); border: 1px solid var(--color-accent); border-radius: 8px; text-align: center; }
        .prestige-button { background-color: var(--color-accent); color: white; margin-top: 10px; }
        .dungeon-item.cleared { opacity: 0.7; } .dungeon-item.locked { opacity: 0.5; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background-color: var(--color-bg-panel); padding: 30px; border-radius: 12px; text-align: center; border: 1px solid var(--color-primary); animation: zoomIn 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 90%; }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        #gacha-result-name { font-size: 1.8em; font-weight: bold; margin: 10px 0; } .item-grade-신화 { color: var(--grade-mythic); } .item-grade-태초 { background: var(--grade-primal); -webkit-background-clip: text; color: transparent; animation: rainbow-text 3s linear infinite; } @keyframes rainbow-text { to { background-position: 200% center; } }
        #gacha-result-info { color: var(--color-text-dim); margin-bottom: 25px; font-size: 1.1em; }
        .modal-close-button { padding: 12px 25px; }
        .multi-gacha-results { max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 20px 0; text-align: left; padding: 10px; background-color: var(--color-bg); border-radius: 8px;}
        .multi-gacha-item { display: flex; align-items: center; gap: 10px; } .multi-gacha-item::before { content: '•'; font-size: 1.5em; }
        .boss-modal { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .boss-info-area { text-align: center; } #boss-name { font-size: 1.8em; color: var(--color-accent); }
        .boss-hp-bar-container { width: 100%; background-color: var(--color-bg-element); border-radius: 10px; padding: 4px; margin: 10px 0; }
        #boss-hp-bar { height: 25px; background-color: var(--color-accent); border-radius: 6px; width: 100%; transition: width 0.2s ease-out; }
        #boss-hp-text { font-size: 0.9em; } .boss-battle-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer; }
        #boss-image-container { height: 60%; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6)); } .boss-stats-area { display: flex; justify-content: space-around; font-size: 1.1em; }
        #boss-timer, #boss-dps { color: var(--color-primary); }
    </style>
</head>
<body>
    <div id="asset-templates" style="display: none;">
        <svg id="svg-scarecrow" viewBox="0 0 100 120" preserveAspectRatio="xMidYMid meet"><line x1="50" y1="0" x2="50" y2="120" stroke="#a0522d" stroke-width="8"/><line x1="10" y1="40" x2="90" y2="40" stroke="#a0522d" stroke-width="6"/><circle cx="50" cy="30" r="25" fill="#f5deb3"/><path d="M35,25 A5,5 0 0,1 45,25 A5,5 0 0,1 35,25 M55,25 A5,5 0 0,1 65,25 A5,5 0 0,1 55,25" fill="black"/><path d="M35,40 Q50,50 65,40" stroke="black" stroke-width="2" fill="none"/></svg>
        <svg id="svg-training-dummy" viewBox="0 0 100 120" preserveAspectRatio="xMidYMid meet"><rect x="30" y="0" width="40" height="120" rx="10" fill="#8B4513"/><rect x="0" y="40" width="100" height="20" rx="5" fill="#8B4513"/><rect x="35" y="10" width="30" height="30" rx="15" fill="#654321"/></svg>
        <svg id="svg-steel-golem" viewBox="0 0 100 120" preserveAspectRatio="xMidYMid meet"><path fill="#bdc3c7" d="M20,20 Q20,0 50,0 Q80,0 80,20 L85,100 Q85,120 65,120 L35,120 Q15,120 15,100 Z"/><path fill="#95a5a6" d="M30,20 Q30,10 50,10 Q70,10 70,20 L75,95 Q75,110 60,110 L40,110 Q25,110 25,95 Z"/><rect x="5" y="35" width="90" height="30" rx="5" fill="#95a5a6"/><circle cx="50" cy="30" r="7" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/></svg>
    </div>

    <div class="game-container">
        <header class="header"><h1>용병 길드 키우기</h1><div id="event-banner" style="display: none;"></div></header>
        <div class="stats-bar">
            <div class="stat-item"><div class="label">전투력</div><div class="value" id="combat-power-display">0</div></div>
            <div class="stat-item"><div class="label">훈련포인트</div><div class="value" id="training-points-display">0</div></div>
            <div class="stat-item"><div class="label">골드</div><div class="value" id="gold-display">0</div></div>
            <div class="stat-item"><div class="label">보석</div><div class="value" id="gem-display">0</div></div>
        </div>
        <div class="main-content"><div class="battlefield-section" id="battlefield"><div id="target-dummy-container"></div><div class="damage-text-container" id="damage-text-container"></div></div></div>
        <div class="tabs">
            <button class="tab-button active" data-tab="training">훈련</button>
            <button class="tab-button" data-tab="enhancement">길드 특성</button>
            <button class="tab-button" data-tab="missions">미션<div id="mission-notification" class="notification-dot"></div></button>
            <button class="tab-button" data-tab="equipment">대장간</button>
            <button class="tab-button" data-tab="companions">선술집</button>
            <button class="tab-button" data-tab="dungeon">보스전</button>
            <button class="tab-button" data-tab="guild">길드</button>
        </div>
        <div id="training" class="tab-content active"><div class="upgrade-item"><div class="upgrade-info"><div class="upgrade-name">훈련 포인트 판매 (꾹 누르기)</div><div class="item-effect">100 TP -> 10 Gold</div></div><button id="sell-tp-button" class="buy-button">판매</button></div><div class="section-title">훈련 교관 강화 (클릭)</div><div id="click-upgrades-list" class="upgrade-list"></div><div class="section-title">자동 훈련 시설 (방치)</div><div id="idle-upgrades-list" class="upgrade-list"></div></div>
        <div id="enhancement" class="tab-content"><div class="section-title">길드 특성 강화</div><div id="guild-skills-list" class="upgrade-list"></div></div>
        <div id="missions" class="tab-content"><div class="section-title">일일/주간 미션</div><div id="mission-list" class="mission-list"></div></div>
        <div id="equipment" class="tab-content"><div class="gacha-section"><span>무기를 뽑아 길드의 전투력을 올립니다.</span><div class="gacha-buttons-container"><button onclick="pullGacha('weapon', 1)" class="gacha-button">1회 (골드 <span id="weapon-gacha-cost-1">100</span>)</button><button onclick="pullGacha('weapon', 10)" class="gacha-button">10회 (골드 <span id="weapon-gacha-cost-10">1000</span>)</button><button onclick="pullGacha('weapon', 100)" class="gacha-button">100회 (골드 <span id="weapon-gacha-cost-100">10000</span>)</button></div></div><div class="section-title">보유 무기</div><div id="weapon-list" class="item-list"></div></div>
        <div id="companions" class="tab-content"><div class="gacha-section"><span>동료를 영입하여 길드를 강화합니다.</span><div class="gacha-buttons-container"><button onclick="pullGacha('companion', 1)" class="gacha-button">1회 (보석 <span id="companion-gacha-cost-1">10</span>)</button><button onclick="pullGacha('companion', 10)" class="gacha-button">10회 (보석 <span id="companion-gacha-cost-10">100</span>)</button><button onclick="pullGacha('companion', 100)" class="gacha-button">100회 (보석 <span id="companion-gacha-cost-100">1000</span>)</button></div></div><div class="section-title">영입한 동료</div><div id="companion-list" class="item-list"></div></div>
        <div id="dungeon" class="tab-content"><div id="daily-raid-section"></div><div class="section-title">메인 보스</div><div id="dungeon-list" class="dungeon-list"></div></div>
        <div id="guild" class="tab-content"><div class="prestige-section"><div class="section-title">길드 재창설</div><p>성장을 초기화하고 '유물 포인트'를 획득하여 영구적인 보너스를 얻습니다.</p><p>조건: '화룡의 둥지' 클리어</p><p>획득할 유물 포인트: <strong id="prestige-reward" style="color: var(--color-primary);">0</strong></p><button id="prestige-button" class="buy-button prestige-button" disabled>재창설</button></div><div class="section-title">고대의 유물</div><div id="artifact-list" class="upgrade-list"></div></div>
        <div id="gacha-modal" class="modal-overlay"><div class="modal-content"><h2>획득!</h2><div id="gacha-result-name"></div><div id="gacha-result-info"></div><button id="gacha-modal-close" class="buy-button modal-close-button">확인</button></div></div>
        <div id="multi-gacha-modal" class="modal-overlay"><div class="modal-content"><h2 id="multi-gacha-title">뽑기 결과</h2><div id="multi-gacha-results" class="multi-gacha-results"></div><button id="multi-gacha-modal-close" class="buy-button modal-close-button">확인</button></div></div>
        <div id="boss-battle-modal" class="modal-overlay"><div class="boss-modal"><div class="boss-info-area"><h2 id="boss-name"></h2><div class="boss-hp-bar-container"><div id="boss-hp-bar"></div></div><div id="boss-hp-text"></div></div><div class="boss-battle-area" id="boss-battle-area"><div id="boss-image-container"></div><div class="damage-text-container" id="boss-damage-text-container"></div></div><div class="boss-stats-area"><div>시간: <span id="boss-timer"></span></div><div>DPS: <span id="boss-dps"></span></div></div></div></div>
    </div>

    <script>
    const GDD = {
      game_design_document: {

    function updateUpgradesUI() { const clickLevel = gameData.clickUpgradeLevel; const clickTier = Math.min(Math.floor(clickLevel / 10), ClickUpgrades.tiers.length - 1); getElement('click-upgrade-name').textContent = ClickUpgrades.tiers[clickTier]; getElement('click-upgrade-level').textContent = clickLevel; const clickGains = calculateClickGains(); getElement('click-upgrade-effect').textContent = `CP +${formatNumber(clickGains.cp)}, TP +${formatNumber(clickGains.tp)}`; const clickCost = calculateClickUpgradeCost(); getElement('click-upgrade-cost').textContent = formatNumber(clickCost); getElement('click-upgrade-button').disabled = gameData.trainingPoints < clickCost; IdleUpgrades.list.forEach((_, index) => { getElement(`idle-upgrade-level-${index}`).textContent = gameData.idleUpgradeLevels[index]; const idleGains = calculateIdleGainsPerFacility(index); getElement(`idle-cp-effect-${index}`).textContent = formatNumber(idleGains.cp); getElement(`idle-tp-effect-${index}`).textContent = formatNumber(idleGains.tp); const idleCost = calculateIdleUpgradeCost(index); getElement(`idle-upgrade-cost-${index}`).textContent = formatNumber(idleCost); getElement(`idle-upgrade-button-${index}`).disabled = gameData.gold < idleCost; }); }
    function updateItemsUI(type) { const listEl = getElement(`${type}-list`); const ownedItems = type === 'weapon' ? gameData.ownedWeapons : gameData.ownedCompanions; const gddList = type === 'weapon' ? WeaponList : CompanionList; listEl.innerHTML = ''; const sortedItems = Object.keys(ownedItems).sort((a, b) => { const itemA = gddList.find(item => item.name === a || item.id === a); const itemB = gddList.find(item => item.name === b || item.id === b); if (!itemA || !itemB) return 0; const gradeOrder = ["태초", "신화", "전설", "L급", "영웅", "S급", "희귀", "A급", "고급", "B급", "일반", "C급"]; return gradeOrder.indexOf(itemA.grade) - gradeOrder.indexOf(itemB.grade); }); if (sortedItems.length === 0) { listEl.innerHTML = `<div style="text-align:center; color: var(--color-text-dim); padding: 20px 0;">보유한 ${type === 'weapon' ? '무기' : '동료'}가 없습니다.</div>`; return; } for (const key of sortedItems) { const itemData = gddList.find(item => item.name === key || item.id === key); if (!itemData) continue; const level = ownedItems[key]; const statBonus = calculateItemStatBonus(itemData, level); const effect = type === 'weapon' ? `클릭 CP +${formatNumber(statBonus)}` : `방치 CP +${formatNumber(statBonus)}/s`; listEl.innerHTML += `<div class="item-card item-grade-${itemData.grade}"><div class="item-info"><div class="item-name item-grade-${itemData.grade}">${itemData.name}</div><div class="item-level">Lv. ${level}</div><div class="item-effect">${effect}</div></div></div>`; } }
    function updateDungeonUI() { const now = Date.now(); const today = new Date().getDay(); const todayBoss = DAILY_BOSSES.find(b => b.day === today); let dailyRaidHTML = `<div class="section-title">오늘의 토벌</div>`; const isDailyDefeated = gameData.lastDailyBossDefeatedDay === new Date().toDateString(); if (todayBoss) { if (isDailyDefeated) { dailyRaidHTML += `<div class="dungeon-item cleared"><div class="dungeon-info"><div class="item-name">${todayBoss.name} (완료)</div></div></div>`; } else { dailyRaidHTML += `<div class="dungeon-item"><div class="dungeon-info"><div class="item-name">${todayBoss.name}</div><div class="dungeon-req">보상: ${todayBoss.reward.type === 'gold' ? '골드' : '보석'} ${formatNumber(todayBoss.reward.value)}</div></div><button class="challenge-button" onclick="startBossBattle(null, true)">도전</button></div>`; } } getElement('daily-raid-section').innerHTML = dailyRaidHTML; DungeonList.forEach((dungeon, index) => { const itemEl = getElement(`dungeon-item-${dungeon.id}`); const buttonEl = getElement(`dungeon-challenge-button-${dungeon.id}`); if (!itemEl || !buttonEl) return; const isUnlocked = index === 0 || gameData.clearedDungeons[DungeonList[index - 1].id]; itemEl.classList.toggle('locked', !isUnlocked); const cooldownEnd = gameData.dungeonCooldowns[dungeon.id] || 0; if (now < cooldownEnd) { const remaining = Math.ceil((cooldownEnd - now) / 1000); buttonEl.textContent = formatTime(remaining); buttonEl.disabled = true; } else { buttonEl.textContent = '도전'; buttonEl.disabled = !isUnlocked || gameData.combatPower < dungeon.req_power; } }); }
    function updateMissionsUI() { const listEl = getElement('mission-list'); listEl.innerHTML = ''; let hasClaimable = false; for(const mission of MISSIONS) { if(gameData.completedMissions[mission.id]) continue; const progress = gameData.missionProgress[mission.target.type] || 0; const isComplete = progress >= mission.target.value; if(isComplete) hasClaimable = true; listEl.innerHTML += `<div class="mission-item"><div class="mission-info"><div class="mission-desc">${mission.desc} (${formatNumber(progress)} / ${formatNumber(mission.target.value)})</div><div class="mission-progress-bar"><div class="mission-progress-fill" style="width: ${Math.min(100, progress / mission.target.value * 100)}%;"></div></div><div class="mission-reward">보상: ${mission.reward.type === 'gems' ? '💎' : '💰'} ${formatNumber(mission.reward.value)}</div></div><button class="buy-button" onclick="claimMissionReward('${mission.id}')" ${!isComplete ? 'disabled' : ''}>${isComplete ? '보상 받기' : '진행중'}</button></div>`; } getElement('mission-notification').style.display = hasClaimable ? 'block' : 'none'; }
    function updateGuildSkillsUI() { GUILD_SKILLS.forEach(skill => { const level = gameData.guildSkills[skill.id] || 0; const cost = calculateGuildSkillCost(skill.id); getElement(`guild-skill-level-${skill.id}`).textContent = level; getElement(`guild-skill-effect-${skill.id}`).textContent = formatNumber(skill.effect(level)); getElement(`guild-skill-cost-${skill.id}`).textContent = formatNumber(cost); getElement(`guild-skill-cost-type-${skill.id}`).textContent = skill.costType === 'gold' ? '골드' : '보석'; getElement(`guild-skill-buy-button-${skill.id}`).disabled = gameData[skill.costType] < cost || level >= skill.maxLevel; }); }
    function updatePrestigeUI() { const prestigeDungeon = DungeonList.find(d => d.name === "화룡의 둥지"); const canPrestige = prestigeDungeon && !!gameData.clearedDungeons[prestigeDungeon.id]; const reward = canPrestige ? calculatePrestigeReward() : 0; getElement('prestige-reward').textContent = formatNumber(reward); getElement('prestige-button').disabled = !canPrestige; }
    function updateArtifactsUI() { getElement('prestige-button').previousElementSibling.previousElementSibling.innerHTML = `보유 유물 포인트: <strong style="color: var(--color-primary);">${formatNumber(gameData.prestige.points)}</strong>`; artifacts.forEach(art => { const level = gameData.prestige.artifacts[art.id] || 0; const cost = calculateArtifactCost(art); getElement(`artifact-level-${art.id}`).textContent = level; getElement(`artifact-cost-${art.id}`).textContent = formatNumber(cost); const button = getElement(`artifact-buy-button-${art.id}`); button.disabled = gameData.prestige.points < cost || level >= art.maxLevel; if (level >= art.maxLevel) button.textContent = "MAX"; }); }
    function updateTargetVisual() { const container = getElement('target-dummy-container'); const levels = gameData.idleUpgradeLevels; let targetSVG; if (levels[7] > 0) targetSVG = getElement('svg-steel-golem').innerHTML; else if (levels[1] > 0) targetSVG = getElement('svg-training-dummy').innerHTML; else targetSVG = getElement('svg-scarecrow').innerHTML; container.innerHTML = targetSVG; }
    function showDamageText({cp, tp, gold}, clickX, clickY, containerId) { const container = getElement(containerId); const targetEl = getElement(containerId === 'damage-text-container' ? 'target-dummy-container' : 'boss-image-container'); const rect = container.getBoundingClientRect(); const x = clickX - rect.left + (Math.random() * 40 - 20); const y = clickY - rect.top + (Math.random() * 20 - 10); if (cp > 0) { const text = document.createElement('div'); text.className = 'damage-text cp'; text.textContent = `+${formatNumber(cp)} CP`; text.style.left = `${x - 30}px`; text.style.top = `${y - 40}px`; container.appendChild(text); setTimeout(() => text.remove(), 950); } if (tp > 0) { const text = document.createElement('div'); text.className = 'damage-text tp'; text.textContent = `+${formatNumber(tp)} TP`; text.style.left = `${x - 30}px`; text.style.top = `${y - 25}px`; container.appendChild(text); setTimeout(() => text.remove(), 950); } if (gold > 0) { const text = document.createElement('div'); text.className = 'damage-text gold'; text.textContent = `+${formatNumber(gold)} G`; text.style.left = `${x - 30}px`; text.style.top = `${y}px`; container.appendChild(text); setTimeout(() => text.remove(), 950); } if (targetEl) { targetEl.classList.remove('shake'); void targetEl.offsetWidth; targetEl.classList.add('shake'); } }
    
    function calculateClickGains() { let cp = 1; let tp = 1 + gameData.clickUpgradeLevel; let gold = 1; const weaponBonus = Object.keys(gameData.ownedWeapons).reduce((sum, name) => { const weapon = WeaponList.find(w => w.name === name); return sum + (weapon ? calculateItemStatBonus(weapon, gameData.ownedWeapons[name]) : 0); }, 0); cp += weaponBonus; if (activeEvent?.type === 'gold') gold *= 2; return {cp, tp, gold}; }
    function calculateIdleGains(timeDelta = 1) { let cp = 0; let tp = 0; gameData.idleUpgradeLevels.forEach((level, index) => { const gains = calculateIdleGainsPerFacility(index); cp += gains.cp; tp += gains.tp; }); const companionBonus = Object.keys(gameData.ownedCompanions).reduce((sum, id) => { const companion = CompanionList.find(c => c.id === id); return sum + (companion ? calculateItemStatBonus(companion, gameData.ownedCompanions[id]) : 0); }, 0); cp += companionBonus; let gold = cp / 20 + tp / 10; if (activeEvent?.type === 'gold') gold *= 2; return { cp: cp * timeDelta, tp: tp * timeDelta, gold: gold * timeDelta }; }
    function calculateIdleGainsPerFacility(index) { const level = gameData.idleUpgradeLevels[index]; if (level === 0) return {cp: 0, tp: 0}; const base = (index + 1) * level; return { cp: base * 0.5, tp: base * 1.5 }; }
    function calculateClickUpgradeCost() { return Math.floor(10 * Math.pow(1.2, gameData.clickUpgradeLevel)); }
    function calculateIdleUpgradeCost(index) { const baseCost = Math.floor(50 * Math.pow(2.2, index)); return Math.floor(baseCost * Math.pow(1.2, gameData.idleUpgradeLevels[index])); }
    function calculateGachaCost(type, amount) { const baseCost = type === 'weapon' ? 100 : 10; return baseCost * amount; }
    function calculateItemStatBonus(item, level) { const multiplier = item.grade.includes('급') ? companionGradeMultipliers[item.grade] : gradeMultipliers[item.grade]; return (multiplier || 1) * level * 0.5; }
    function calculatePrestigeReward() { const clearedCount = Object.keys(gameData.clearedDungeons).length; return Math.floor(Math.pow(clearedCount / 5, 2)); }
    function calculateArtifactCost(artifact) { const level = gameData.prestige.artifacts[artifact.id] || 0; return Math.floor(artifact.cost * Math.pow(artifact.costIncrease || 1.5, level)); }
    function calculateGuildSkillCost(skillId) { const skill = GUILD_SKILLS.find(s => s.id === skillId); const level = gameData.guildSkills[skill.id] || 0; return Math.floor(skill.baseCost * Math.pow(skill.costScale, level)); }
    function calculatePlayerDamage(isCrit) { let damage = gameData.combatPower / 50; if (isCrit) { const critDamage = 1.5 + ((gameData.guildSkills.critDamage || 0) * 0.05); damage *= critDamage; } return Math.max(1, damage); }
    function calculateCompanionDPS() { return Object.keys(gameData.ownedCompanions).reduce((sum, id) => { const companion = CompanionList.find(c => c.id === id); return sum + (companion ? calculateItemStatBonus(companion, gameData.ownedCompanions[id]) : 0); }, 0); }

    function sellTrainingPoints() { gameData.trainingPoints -= 100; gameData.gold += 10; updateUI(); }
    function buyClickUpgrade() { const cost = calculateClickUpgradeCost(); if (gameData.trainingPoints >= cost) { gameData.trainingPoints -= cost; gameData.clickUpgradeLevel++; updateAllUI(); } }
    function buyIdleUpgrade(index) { const cost = calculateIdleUpgradeCost(index); if (gameData.gold >= cost) { gameData.gold -= cost; gameData.idleUpgradeLevels[index]++; updateAllUI(); } }
    function buyGuildSkill(skillId) { const skill = GUILD_SKILLS.find(s => s.id === skillId); const cost = calculateGuildSkillCost(skillId); const level = gameData.guildSkills[skill.id] || 0; if (gameData[skill.costType] >= cost && level < skill.maxLevel) { gameData[skill.costType] -= cost; gameData.guildSkills[skill.id] = level + 1; updateAllUI(); } }
    function pullGacha(type, amount) { const cost = calculateGachaCost(type, amount); const currency = type === 'weapon' ? 'gold' : 'gems'; if (gameData[currency] < cost) return; gameData[currency] -= cost; const results = []; for (let i = 0; i < amount; i++) { const gachaRates = type === 'weapon' ? weaponGachaRates : companionGachaRates; const gddList = type === 'weapon' ? WeaponList : CompanionList; const rand = Math.random() * 100; let selectedGrade; for (const grade in gachaRates) { if (rand <= gachaRates[grade]) { selectedGrade = grade; break; } } const itemsOfGrade = gddList.filter(item => item.grade === selectedGrade); if (itemsOfGrade.length > 0) { const drawnItem = itemsOfGrade[Math.floor(Math.random() * itemsOfGrade.length)]; results.push(drawnItem); const itemKey = drawnItem.id || drawnItem.name; const ownedItems = type === 'weapon' ? gameData.ownedWeapons : gameData.ownedCompanions; ownedItems[itemKey] = (ownedItems[itemKey] || 0) + 1; } } if (amount === 1 && results.length > 0) { const drawnItem = results[0]; const modal = getElement('gacha-modal'); const resultName = getElement('gacha-result-name'); const resultInfo = getElement('gacha-result-info'); resultName.textContent = drawnItem.name; resultName.className = `item-grade-${drawnItem.grade}`; resultInfo.textContent = `Lv.${gameData.ownedWeapons[drawnItem.name] || gameData.ownedCompanions[drawnItem.id]}`; modal.style.display = 'flex'; } else if (amount > 1) { const modal = getElement('multi-gacha-modal'); const resultsEl = getElement('multi-gacha-results'); getElement('multi-gacha-title').textContent = `${amount}회 뽑기 결과`; resultsEl.innerHTML = ''; results.forEach(item => { resultsEl.innerHTML += `<div class="multi-gacha-item item-grade-${item.grade}">${item.name}</div>`; }); modal.style.display = 'flex'; } updateAllUI(); }
    function startBossBattle(dungeonId, isDaily = false) { const dungeon = isDaily ? DAILY_BOSSES.find(b => b.day === new Date().getDay()) : DungeonList.find(d => d.id === dungeonId); if (!dungeon) return; bossBattleState = { dungeonId: dungeon.id, isDaily, hp: isDaily ? dungeon.hp * gameData.combatPower : dungeon.req_power * 5, maxHp: isDaily ? dungeon.hp * gameData.combatPower : dungeon.req_power * 5, timer: 30, dps: calculateCompanionDPS() }; const modal = getElement('boss-battle-modal'); getElement('boss-name').textContent = dungeon.name; getElement('boss-image-container').innerHTML = getElement('svg-steel-golem').innerHTML; modal.style.display = 'flex'; getElement('boss-battle-area').onclick = (e) => { const critChance = (gameData.guildSkills.critChance || 0) * 0.2; const isCrit = Math.random() * 100 < critChance; const damage = calculatePlayerDamage(isCrit); bossBattleState.hp -= damage; const damageTextEl = document.createElement('div'); damageTextEl.className = 'damage-text cp'; damageTextEl.textContent = `${formatNumber(damage)}`; if(isCrit) { damageTextEl.style.color = 'yellow'; damageTextEl.style.fontSize = '1.8em'; damageTextEl.textContent += "!"; } const rect = getElement('boss-damage-text-container').getBoundingClientRect(); damageTextEl.style.left = `${e.clientX - rect.left - 30}px`; damageTextEl.style.top = `${e.clientY - rect.top - 25}px`; getElement('boss-damage-text-container').appendChild(damageTextEl); setTimeout(() => damageTextEl.remove(), 950); if (bossBattleState.hp <= 0) endBossBattle(true); }; bossBattleState.interval = setInterval(bossBattleLoop, 1000); bossBattleLoop(); }
    function bossBattleLoop() { if (!bossBattleState.interval) return; bossBattleState.timer--; bossBattleState.hp -= bossBattleState.dps; getElement('boss-timer').textContent = formatTime(bossBattleState.timer); getElement('boss-dps').textContent = formatNumber(bossBattleState.dps); const hpPercent = Math.max(0, (bossBattleState.hp / bossBattleState.maxHp) * 100); getElement('boss-hp-bar').style.width = `${hpPercent}%`; getElement('boss-hp-text').textContent = `${formatNumber(bossBattleState.hp)} / ${formatNumber(bossBattleState.maxHp)}`; if (bossBattleState.hp <= 0) endBossBattle(true); else if (bossBattleState.timer <= 0) endBossBattle(false); }
    function endBossBattle(isWin) { clearInterval(bossBattleState.interval); bossBattleState.interval = null; getElement('boss-battle-modal').style.display = 'none'; getElement('boss-battle-area').onclick = null; const dungeon = bossBattleState.isDaily ? DAILY_BOSSES.find(b => b.day === new Date().getDay()) : DungeonList.find(d => d.id === bossBattleState.dungeonId); if (isWin) { alert(`${dungeon.name} 토벌 성공!`); if(bossBattleState.isDaily) { gameData.lastDailyBossDefeatedDay = new Date().toDateString(); gameData[dungeon.reward.type] += dungeon.reward.value; } else { gameData.clearedDungeons[dungeon.id] = true; gameData.dungeonCooldowns[dungeon.id] = Date.now() + BOSS_COOLDOWN * 1000; const goldReward = dungeon.req_power * 5; const gemReward = Math.max(1, (Math.floor(Math.log10(dungeon.req_power)))*(Math.floor(Math.log10(dungeon.req_power)))); gameData.gold += goldReward; gameData.gems += gemReward; } } else { alert('시간 초과! 토벌에 실패했습니다.'); } updateAllUI(); }
    function checkAllMissions() { for(const mission of MISSIONS) { if(gameData.completedMissions[mission.id]) continue; const targetType = mission.target.type; if(!gameData.missionProgress[targetType]) gameData.missionProgress[targetType] = 0; if (targetType === 'clicks') gameData.missionProgress.clicks = gameData.clickCount; else gameData.missionProgress[targetType] = gameData[targetType]; } }
    function claimMissionReward(missionId) { const mission = MISSIONS.find(m => m.id === missionId); if(!mission || gameData.completedMissions[missionId]) return; const progress = gameData.missionProgress[mission.target.type] || 0; if(progress >= mission.target.value) { gameData[mission.reward.type] += mission.reward.value; gameData.completedMissions[missionId] = true; updateMissionsUI(); updateUI(); } }
    function checkActiveEvent() { const day = new Date().getDay(); if (day === 0 || day === 6) { activeEvent = { type: 'gold', description: '주말 핫타임! 골드 획득량 2배!' }; getElement('event-banner').textContent = activeEvent.description; getElement('event-banner').style.display = 'block'; } else { activeEvent = null; getElement('event-banner').style.display = 'none'; } return activeEvent; }
    function doPrestige() { /* ... */ }
    function buyArtifact(id) { /* ... */ }

    function gameLoop() { const { cp, tp, gold } = calculateIdleGains(); gameData.combatPower += cp; gameData.trainingPoints += tp; gameData.gold += gold; gameData.lastOnline = Date.now(); checkAllMissions(); updateUI(); updateDungeonUI(); updateMissionsUI(); }
    function saveGame() { localStorage.setItem('mercenaryGuildManagerSave_v6', JSON.stringify(gameData)); }

    document.addEventListener('DOMContentLoaded', initGame);
    </script>
